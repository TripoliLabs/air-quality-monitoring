# =============================================================================
# Air Quality Monitoring — Local Development Stack
# =============================================================================
#
# Full local stack: the backing services (Postgres, TimescaleDB, Redis, NanoMQ,
# ChirpStack) plus the app services (api, ingestion, dashboard) built from source
# with hot reload. Prefer running an individual app on the HOST
# (`pnpm --filter @aq/<name> start:dev|dev`) for the fastest inner loop.
#
# Usage:
#   docker compose up -d                          # default: db, redis, mqtt, ChirpStack
#   docker compose --profile observability up -d  # + Grafana / Prometheus / Loki
#   docker compose down                           # stop (add -v to wipe volumes)
#
# Connection defaults (override via a root .env file):
#   Postgres/Timescale : localhost:5439  (user/pass/db = airquality)
#   Redis              : localhost:6379
#   MQTT               : localhost:1883   (ws: 9001)
#   ChirpStack UI      : http://localhost:8080
#   Grafana            : http://localhost:3001  (admin/admin)
#   Prometheus         : http://localhost:9090
# =============================================================================

name: airquality

services:
  # ===========================================================================
  # Core data plane  (started by default — everything needs these)
  # ===========================================================================

  # Relational app database (normal PostgreSQL). Users, auth, API keys,
  # sensor/device metadata, locations, dashboard config — and ChirpStack's own
  # state. Kept SEPARATE from telemetry so ingestion write-load never contends
  # with app reads. Schema is owned by migrations, not initdb (init only adds
  # the pg_trgm extension ChirpStack needs).
  postgres:
    image: postgres:16-alpine
    container_name: airquality-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${APP_DB_USERNAME:-airquality}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-airquality}
      POSTGRES_DB: ${APP_DB_NAME:-airquality}
    ports:
      - "${APP_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/local/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USERNAME:-airquality} -d ${APP_DB_NAME:-airquality}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Telemetry database — a DEDICATED TimescaleDB instance for time-series sensor
  # readings ONLY: hypertables, continuous aggregates, compression + retention.
  # The timescaledb extension is auto-created in POSTGRES_DB by this image.
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: airquality-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TSDB_USERNAME:-airquality}
      POSTGRES_PASSWORD: ${TSDB_PASSWORD:-airquality}
      POSTGRES_DB: ${TSDB_NAME:-telemetry}
    ports:
      - "${TSDB_PORT:-5439}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TSDB_USERNAME:-airquality} -d ${TSDB_NAME:-telemetry}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: airquality-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MQTT broker. NanoMQ — a lightweight (C / NNG) MQTT 5.0 broker, tiny memory
  # footprint and well suited to edge/IoT. Production uses EMQX (same EMQ
  # ecosystem, identical MQTT contract), so app code is unaffected.
  mqtt:
    image: emqx/nanomq:latest
    container_name: airquality-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT (TCP)
      - "8083:8083"   # MQTT over WebSocket
      - "8081:8081"   # HTTP REST API
    volumes:
      - ./deploy/local/mqtt/nanomq.conf:/usr/local/nanomq/nanomq.conf:ro

  # ===========================================================================
  # LoRaWAN network server
  # ===========================================================================
  chirpstack:
    image: chirpstack/chirpstack:4
    container_name: airquality-chirpstack
    restart: unless-stopped
    command: -c /etc/chirpstack
    volumes:
      - ./edge/chirpstack:/etc/chirpstack:ro
    ports:
      - "8080:8080" # Web UI / gRPC + gRPC-web API
    # ChirpStack stores its own state in the relational Postgres (configured in
    # edge/chirpstack/chirpstack.toml). It talks to gateways over MQTT via the
    # gateway backend in edge/chirpstack/region_eu868.toml (topic prefix eu868).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started

  # ChirpStack Gateway Bridge — receives the Semtech UDP packet-forwarder
  # protocol from gateways (port 1700) and bridges it to ChirpStack over MQTT.
  # This is exactly how a real RAK7268 gateway connects.
  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    container_name: airquality-gateway-bridge
    restart: unless-stopped
    ports:
      - "1700:1700/udp" # Semtech UDP packet forwarder
    environment:
      INTEGRATION__MARSHALER: json
      INTEGRATION__MQTT__AUTH__GENERIC__SERVERS: tcp://mqtt:1883
      INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE: "eu868/gateway/{{ .GatewayID }}/event/{{ .EventType }}"
      INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE: "eu868/gateway/{{ .GatewayID }}/state/{{ .StateType }}"
      INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE: "eu868/gateway/{{ .GatewayID }}/command/#"
    depends_on:
      mqtt:
        condition: service_started

  # REST/JSON gateway for the ChirpStack gRPC API — used by the simulator to
  # provision the application, device-profile, gateway and devices.
  chirpstack-rest-api:
    image: chirpstack/chirpstack-rest-api:4
    container_name: airquality-chirpstack-rest
    restart: unless-stopped
    command: --server chirpstack:8080 --bind 0.0.0.0:8090 --insecure
    ports:
      - "8090:8090"
    depends_on:
      chirpstack:
        condition: service_started

  # ===========================================================================
  # Observability (LGTM-lite)  (profile: observability)
  # Full Tempo/Mimir/Alloy stack with its own configs lives in
  # deploy/observability/ — this is a lean local subset.
  # ===========================================================================
  grafana:
    image: grafana/grafana:11
    container_name: airquality-grafana
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "3002:3000" # host 3001 is taken by the ingestion service
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/observability/provisioning:/etc/grafana/provisioning:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: airquality-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  # Loki runs with its built-in default config (no mount required for local dev).
  loki:
    image: grafana/loki:3
    container_name: airquality-loki
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki

  # Tempo — traces backend; receives OTLP/HTTP on :4318 from the services.
  # Enable trace export by setting OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
  # when bringing up the stack with this profile.
  tempo:
    image: grafana/tempo:2
    container_name: airquality-tempo
    restart: unless-stopped
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "3200:3200" # Tempo query API (Grafana datasource)
      - "4318:4318" # OTLP/HTTP receiver
    volumes:
      - ./deploy/observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo

  # ===========================================================================
  # Migrations — one-shot, runs to completion before the apps start.
  # Discrete step (not app-on-startup): runs once, in one place across both DBs,
  # and can hold DDL privileges the runtime apps don't. Idempotent.
  # ===========================================================================
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: deps # has the full install (drizzle-kit) + built @aq/db (seed)
    container_name: airquality-migrate
    command: >
      sh -c "pnpm --filter @aq/db migrate:relational &&
             pnpm --filter @aq/db migrate:telemetry &&
             pnpm --filter @aq/db db:seed"
    environment:
      APP_DB_URL: postgres://${APP_DB_USERNAME:-airquality}:${APP_DB_PASSWORD:-airquality}@postgres:5432/${APP_DB_NAME:-airquality}
      TSDB_URL: postgres://${TSDB_USERNAME:-airquality}:${TSDB_PASSWORD:-airquality}@timescaledb:5432/${TSDB_NAME:-telemetry}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  # ===========================================================================
  # Application services  (dev target, hot reload)
  # Build context is the REPO ROOT (single pnpm workspace lockfile). Source is
  # bind-mounted for live reload; each app's node_modules is kept inside the
  # container via an anonymous volume so host files never shadow the install.
  # ===========================================================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: airquality-api
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "9229:9229" # debugger
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${APP_DB_USERNAME:-airquality}
      DB_PASSWORD: ${APP_DB_PASSWORD:-airquality}
      DB_NAME: ${APP_DB_NAME:-airquality}
      TSDB_HOST: timescaledb
      TSDB_PORT: 5432
      TSDB_USERNAME: ${TSDB_USERNAME:-airquality}
      TSDB_PASSWORD: ${TSDB_PASSWORD:-airquality}
      TSDB_NAME: ${TSDB_NAME:-telemetry}
      REDIS_URL: redis://redis:6379
      MQTT_URL: mqtt://mqtt:1883
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # OpenTelemetry: metrics are always exposed on :9464; set the OTLP endpoint
      # (e.g. http://tempo:4318) to also export traces — see the observability profile.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      CHOKIDAR_USEPOLLING: "true" # reliable file-watching across the bind mount
    volumes:
      - ./apps/api:/repo/apps/api
      - /repo/apps/api/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started

  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
      target: dev
    container_name: airquality-ingestion
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      TSDB_HOST: timescaledb
      TSDB_PORT: 5432
      TSDB_USERNAME: ${TSDB_USERNAME:-airquality}
      TSDB_PASSWORD: ${TSDB_PASSWORD:-airquality}
      TSDB_NAME: ${TSDB_NAME:-telemetry}
      MQTT_URL: mqtt://mqtt:1883
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./services/ingestion:/repo/services/ingestion
      - /repo/services/ingestion/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      target: dev
    container_name: airquality-dashboard
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3000}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/dashboard:/repo/apps/dashboard
      - /repo/apps/dashboard/node_modules
    depends_on:
      - api

  # ===========================================================================
  # Simulated LoRaWAN deployment — emits realistic ChirpStack uplinks for the
  # fixture nodes (multi-gateway rxInfo, diurnal patterns, battery drain) so the
  # whole pipeline runs on live data. Disable with: docker compose up --scale simulator=0
  # ===========================================================================
  simulator:
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
      target: dev
    container_name: airquality-simulator
    restart: unless-stopped
    environment:
      CHIRPSTACK_GRPC: chirpstack:8080
      CHIRPSTACK_REST: http://chirpstack-rest-api:8090
      GATEWAY_BRIDGE_HOST: chirpstack-gateway-bridge
      GATEWAY_BRIDGE_PORT: "1700"
      GATEWAY_EUI: ac1f09fffe000101
      KEYS_DIR: /keys
      SIM_INTERVAL_MS: "15000"
    volumes:
      # LoRaWAN session keys live in a Docker volume — never the repo.
      - lorawan_keys:/keys
    depends_on:
      chirpstack-rest-api:
        condition: service_started
      chirpstack-gateway-bridge:
        condition: service_started
      ingestion:
        condition: service_started

  # ===========================================================================
  # ESP32 firmware cross-compile — ONE-SHOT build (profile: firmware).
  # Firmware is chip code, not a long-running service, so it is built on demand,
  # not "up"-ed. Cross-compiles the same firmware/core/ that the host build uses.
  #   docker compose --profile firmware run --rm firmware-esp32
  #   → firmware/build-esp32/aq-node.bin
  # ===========================================================================
  firmware-esp32:
    image: espressif/idf:release-v5.2
    container_name: airquality-firmware-esp32
    profiles: ["firmware"]
    working_dir: /project
    volumes:
      - ./firmware:/project
    command: idf.py -B build-esp32 set-target esp32 build

volumes:
  postgres_data:
  timescaledb_data:
  redis_data:
  lorawan_keys:
  grafana_data:
  prometheus_data:
  loki_data:
  tempo_data:

networks:
  default:
    name: airquality-network
