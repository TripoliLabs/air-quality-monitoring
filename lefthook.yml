# Lefthook - Git hooks manager
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    # Backend / packages — Biome (apps/api, services/*, packages/*)
    backend-lint:
      glob: "{apps/api,services,packages}/**/*.{ts,js}"
      # --no-errors-on-unmatched: staged files outside Biome's `src/**` scope
      # (e.g. test/ files) are skipped instead of failing the hook.
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files} && git add {staged_files}
      stage_fixed: true

    # Dashboard — ESLint + Prettier
    dashboard-lint:
      root: "apps/dashboard/"
      glob: "**/*.{ts,js,vue}"
      run: pnpm exec eslint --fix {staged_files} && git add {staged_files}
      stage_fixed: true

    dashboard-format:
      root: "apps/dashboard/"
      glob: "**/*.{ts,js,vue,css,json,html}"
      run: pnpm exec prettier --write {staged_files} && git add {staged_files}
      stage_fixed: true

    # Secrets detection (enable when ready)
    secrets:
      run: |
        if git diff --cached --name-only | xargs grep -l -E "(password|secret|api_key|apikey|token).*=.*['\"][^'\"]+['\"]" 2>/dev/null; then
          echo "Potential secrets detected in staged files!"
          exit 1
        fi
      skip: true

commit-msg:
  commands:
    conventional:
      run: |
        MSG=$(cat {1})
        if ! echo "$MSG" | grep -qE "^(feat|fix|docs|style|refactor|test|chore|ci|build|perf)(\(.+\))?!?: .+"; then
          echo "Commit message must follow conventional commits format:"
          echo "  <type>(<scope>): <description>"
          echo ""
          echo "Types: feat, fix, docs, style, refactor, test, chore, ci, build, perf"
          exit 1
        fi
