name: CI

on:
  push:
    branches: [prod, staging]
  pull_request:
    branches: [prod, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, typecheck, build, and the fast unit/firmware tests (no services needed).
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # version read from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turbo runs each task across the workspace in dependency order, caching
      # unchanged packages.
      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm test

      - name: Firmware host tests
        run: make -C firmware test

  # Slim integration: the API + ingestion services against their real backing
  # stores (Postgres, TimescaleDB, Redis, Mosquitto). `up api ingestion` pulls in
  # only those via depends_on — NOT the heavy/flaky ChirpStack + simulator +
  # dashboard. The full-stack e2e smoke (scripts/e2e-smoke.sh) and the ESP32
  # cross-compile (scripts/firmware-esp32-build.sh) are run locally; see CLAUDE.md.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The integration tests import the shared packages (e.g. @aq/telemetry-codec).
      - name: Build workspace packages
        run: pnpm --filter "./packages/*" build

      - name: Start the slim stack (api + ingestion + their stores + migrations)
        run: docker compose up -d --build api ingestion

      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::API did not become healthy in time"
          docker compose logs --tail 100 api
          exit 1

      - name: API integration tests
        run: pnpm --filter @aq/api run test:integration

      - name: Ingestion integration tests
        run: pnpm --filter @aq/ingestion run test:integration

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
