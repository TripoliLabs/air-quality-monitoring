name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, typecheck, build, and the fast unit/firmware tests (no services needed).
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6 # version read from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turbo runs each task across the workspace in dependency order, caching
      # unchanged packages.
      - name: Lint
        run: pnpm run lint

      - name: Lint shared package source
        run: pnpm exec biome check packages test/support

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Unit tests
        # pnpm 12 consumes the first separator; retain the second for Turbo.
        run: pnpm run test -- -- --reporter=default --reporter=junit --outputFile.junit=./test-results/unit.xml

      - name: Firmware host tests
        run: make -C firmware test

      - name: Upload failed unit test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-test-reports
          path: '**/test-results/*.xml'
          retention-days: 7

  # Slim integration: the API + ingestion services against their real backing
  # stores (Postgres, TimescaleDB, Redis, Mosquitto). `up api ingestion` pulls in
  # only those via depends_on — NOT the heavy/flaky ChirpStack + simulator +
  # dashboard. The full-stack e2e smoke (scripts/e2e-smoke.sh) and the ESP32
  # cross-compile (scripts/firmware-esp32-build.sh) are run locally; see CLAUDE.md.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADMIN_API_KEY: "ci-test-admin-key"
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The integration tests import the shared packages (e.g. @aq/telemetry-codec).
      - name: Build workspace packages
        run: pnpm --filter "./packages/*" build

      - name: Start the slim stack (api + ingestion + their stores + migrations)
        run: docker compose up -d --build api ingestion

      - name: Wait for API and ingestion readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS --max-time 3 http://localhost:3000/health >/dev/null &&
               curl -fsS --max-time 3 http://localhost:3001/health >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::API or ingestion did not become ready in time"
          exit 1

      - name: API integration tests
        run: pnpm --filter @aq/api run test:integration --reporter=default --reporter=junit --outputFile.junit=./test-results/integration.xml

      - name: Ingestion integration tests
        run: pnpm --filter @aq/ingestion run test:integration --reporter=default --reporter=junit --outputFile.junit=./test-results/integration.xml

      - name: Repeat recovery and concurrency regressions
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @aq/ingestion exec vitest run configuration-recovery.integration.test.ts --reporter=default --reporter=junit --outputFile.junit=./test-results/recovery-${attempt}.xml
          done

      - name: Dump logs on failure
        if: failure()
        run: |
          mkdir -p test-results
          docker compose logs --no-color --tail 200 api ingestion migrate postgres timescaledb redis mqtt > test-results/services.log 2>&1
          cat test-results/services.log

      - name: Upload failed integration diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-diagnostics
          path: |
            **/test-results/*.xml
            test-results/services.log
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v
