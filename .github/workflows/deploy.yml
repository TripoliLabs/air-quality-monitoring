name: CD - Build & Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_sha:
        description: Full commit SHA of previously published images (rollback)
        required: true
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      prefix: ${{ steps.release.outputs.prefix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Validate release
        id: release
        env:
          REQUESTED_SHA: ${{ inputs.image_sha || github.event.workflow_run.head_sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/main
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${REPOSITORY_OWNER,,}/air-quality" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: release
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
            target: prod
          - service: ingestion
            dockerfile: services/ingestion/Dockerfile
            target: prod
          - service: dashboard
            dockerfile: apps/dashboard/Dockerfile
            target: prod
          - service: migrate
            dockerfile: packages/db/Dockerfile
            target: runner
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build locally for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          load: true
          tags: ${{ needs.release.outputs.prefix }}-${{ matrix.service }}:${{ needs.release.outputs.sha }}
      - name: Scan before publishing
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ needs.release.outputs.prefix }}-${{ matrix.service }}:${{ needs.release.outputs.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Publish SHA tag
        env:
          IMAGE: ${{ needs.release.outputs.prefix }}-${{ matrix.service }}:${{ needs.release.outputs.sha }}
        run: docker push "$IMAGE"

  deploy-production:
    needs: [release, build-and-push]
    if: >-
      always() && vars.DEPLOY_ENABLED == 'true' &&
      needs.release.result == 'success' &&
      (needs.build-and-push.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && needs.build-and-push.result == 'skipped'))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - name: Configure pinned SSH identity
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Transfer and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          IMAGE_SHA: ${{ needs.release.outputs.sha }}
          IMAGE_PREFIX: ${{ needs.release.outputs.prefix }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || exit 1
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            latest=$(git ls-remote origin refs/heads/main | cut -f1)
            if [[ "$latest" != "$IMAGE_SHA" ]]; then
              echo 'Skipping superseded automatic deployment.'
              exit 0
            fi
          fi
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          release_dir="/opt/aq/releases/${IMAGE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Client-side expansion is intentional; SHA/host are validated above.
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "deploy@$DEPLOY_HOST" "mkdir -p '$release_dir'"
          # shellcheck disable=SC2029
          tar -czf - deploy | ssh "${ssh_opts[@]}" "deploy@$DEPLOY_HOST" "tar -xzf - -C '$release_dir'"
          # shellcheck disable=SC2029
          printf '%s\n' "$GHCR_TOKEN" | ssh "${ssh_opts[@]}" "deploy@$DEPLOY_HOST" \
            "GHCR_USER='$GHCR_USER' IMAGE_PREFIX='$IMAGE_PREFIX' bash '$release_dir/deploy/scripts/deploy.sh' '$IMAGE_SHA'"
      - name: Remove SSH material
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
