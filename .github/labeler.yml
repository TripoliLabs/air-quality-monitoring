# Auto-label PRs based on changed files!

firmware:
  - changed-files:
    - any-glob-to-any-file: 'firmware/**/*'

api:
  - changed-files:
    - any-glob-to-any-file: 'apps/api/**/*'

ingestion:
  - changed-files:
    - any-glob-to-any-file: 'services/ingestion/**/*'

dashboard:
  - changed-files:
    - any-glob-to-any-file: 'apps/dashboard/**/*'

packages:
  - changed-files:
    - any-glob-to-any-file: 'packages/**/*'

database:
  - changed-files:
    - any-glob-to-any-file:
      - 'packages/db/**/*'
      - 'database/**/*'
      - '**/*.sql'

documentation:
  - changed-files:
    - any-glob-to-any-file:
      - 'docs/**/*'
      - '**/*.md'

hardware:
  - changed-files:
    - any-glob-to-any-file: 'hardware/**/*'

gateway:
  - changed-files:
    - any-glob-to-any-file: 'edge/**/*'

infrastructure:
  - changed-files:
    - any-glob-to-any-file:
      - 'docker-compose*.yml'
      - '**/Dockerfile'
      - 'infra/**/*'
      - 'deploy/**/*'
      - '.github/**/*'

observability:
  - changed-files:
    - any-glob-to-any-file:
      - 'deploy/observability/**/*'
      - 'packages/observability/**/*'
