; PlatformIO Project Configuration File
; Air Quality Monitoring Node - LILYGO T-Beam V1.2
; https://docs.platformio.org/page/projectconf.html

[platformio]
; The ESP-IDF `main` component (main/CMakeLists.txt) is the single source list
; for both this build and the idf.py build (scripts/firmware-esp32-build.sh).
; It pulls in src/main.cpp, core/ and adapters/esp32/.
src_dir = main

[env:tbeam-v12]
; Pinned to the current platform major (ESP-IDF 6.1) — the same line the idf.py
; Docker build uses. Pinned so a new major cannot change the toolchain silently.
platform = espressif32@^7.1.3
board = ttgo-t-beam
framework = espidf
monitor_speed = 115200

; ESP-IDF specific settings
board_build.partitions = partitions.csv

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DLILYGO_TBEAM_V1_2

; Library dependencies: none here. RadioLib (LoRaWAN stack for the SX1276) is an
; ESP-IDF managed component declared in main/idf_component.yml, so both build
; routes get the same pinned version. PMS7003 (UART) and BME280 (I2C) are driven
; directly via ESP-IDF in adapters/esp32/sensors_esp32.c.

; Upload settings
upload_speed = 921600

; Monitor filters
monitor_filters =
    esp32_exception_decoder
    time
