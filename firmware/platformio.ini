; PlatformIO Project Configuration File
; Air Quality Monitoring Node - LILYGO T-Beam V1.2
; https://docs.platformio.org/page/projectconf.html

[env:tbeam-v12]
platform = espressif32
board = ttgo-t-beam
framework = espidf
monitor_speed = 115200

; ESP-IDF specific settings
board_build.partitions = partitions.csv

; Compile the portable core + the ESP32 hardware adapters alongside src/.
build_src_filter =
    +<*>
    +<../core/>
    +<../adapters/esp32/>

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DLILYGO_TBEAM_V1_2
    -Icore

; Library dependencies
lib_deps =
    ; LoRaWAN stack — drives the SX1276 + runs the LoRaWAN MAC (OTAA).
    ; Provides <RadioLib.h>, which activates the real implementation in
    ; adapters/esp32/lora_esp32.cpp (uses the vendored EspHal for framework=espidf).
    jgromes/RadioLib@^6.6.0
    ; PMS7003 (UART) and BME280 (I2C) are driven directly via ESP-IDF
    ; (driver/uart.h, driver/i2c_master.h) in adapters/esp32/sensors_esp32.c —
    ; no extra libraries required.

; Upload settings
upload_speed = 921600

; Monitor filters
monitor_filters =
    esp32_exception_decoder
    time
