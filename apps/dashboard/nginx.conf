worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Container health check. Not /health: that is a page in the dashboard.
        location = /healthz {
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        # The dashboard calls the API on its own origin under /api. The trailing
        # slashes strip the prefix, so /api/sensors reaches the API as /sensors.
        location /api/ {
            proxy_pass http://api:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Live readings (Socket.IO: WebSocket, with long-polling as a fallback).
        location /socket.io/ {
            proxy_pass http://api:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 1h;
        }

        # Fingerprinted build output never changes, so it can be cached for good.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA fallback: every other path is a client-side route. index.html is
        # never cached, so a new deploy is picked up on the next visit.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
