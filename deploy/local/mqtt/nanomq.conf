# NanoMQ — local development broker config (HOCON)
# Docs: https://nanomq.io/docs/en/latest/config-description/introduction.html
#
# Local dev only: anonymous access is allowed so ChirpStack and the ingestion
# service can connect without credentials. Production uses EMQX with auth.

listeners.tcp {
  bind = "0.0.0.0:1883"
}

listeners.ws {
  bind = "0.0.0.0:8083"
}

http_server {
  port = 8081
  username = admin
  password = public
  auth_type = basic
}

mqtt {
  max_packet_size = 1MB
  max_mqueue_len = 2048
  retry_interval = 10s
  keepalive_multiplier = 1.25
}

auth {
  allow_anonymous = true
  no_match = allow
}
