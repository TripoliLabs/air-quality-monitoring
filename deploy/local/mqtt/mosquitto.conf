# Mosquitto — local development broker. Internal glue for ChirpStack
# (gateway-bridge → MQTT → ChirpStack → MQTT → ingestion). The SAME broker runs
# in prod (add a TLS listener + auth there, no public exposure). Local dev allows
# anonymous access so ChirpStack + ingestion connect without credentials.
# See docs/deployment-and-strategy.md §2.

listener 1883 0.0.0.0
allow_anonymous true

# MQTT over WebSocket (parity with the previous NanoMQ 8083 listener).
listener 8083 0.0.0.0
protocol websockets

persistence false
log_dest stdout
