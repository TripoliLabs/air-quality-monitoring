# Grafana unified-alerting rules (auto-provisioned). Built on the metrics the
# services actually emit via Alloy. In Grafana Cloud these same rules attach to a
# contact point (Slack/email/PagerDuty) per environment; locally they evaluate and show state.
apiVersion: 1
groups:
  - orgId: 1
    name: pipeline
    folder: Air Quality
    interval: 1m
    rules:
      - uid: aq-no-readings
        title: Ingestion stalled (no readings)
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: No readings ingested in the last 5 minutes — the pipeline may be down.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum(rate(readings_ingested_total[5m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [0.001]

      - uid: aq-api-5xx
        title: API 5xx errors
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: The API is returning 5xx responses.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum(rate(http_server_duration_count{service="api", http_status_code=~"5.."}[5m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: aq-gateway-offline
        title: LoRaWAN Gateway offline
        condition: C
        for: 15m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: No gateway bridge uplinks received for 15 minutes — the gateway or 4G backhaul may be offline.
        data:
          - refId: A
            relativeTimeRange:
              from: 1200
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum(rate(gateway_bridge_events_total[15m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [0.001]

      - uid: aq-node-low-battery
        title: Sensor node battery low (< 3.4V)
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: Sensor node battery voltage is below 3.4V (approx. 20% capacity remaining).
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: min by (device_id) (sensor_battery_voltage_volts)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [3.4]

      - uid: aq-disk-space-low
        title: Persistent storage disk usage > 80%
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: Host persistent block storage volume (/mnt/data) is exceeding 80% disk capacity.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 100 - ((node_filesystem_avail_bytes{mountpoint=~"/mnt/data.*|/"} * 100) / node_filesystem_size_bytes{mountpoint=~"/mnt/data.*|/"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [80]
