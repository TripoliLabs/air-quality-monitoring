global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # OpenTelemetry Prometheus exporters (see @aq/observability initTelemetry).
  - job_name: 'api'
    static_configs:
      - targets: ['api:9464']
  - job_name: 'ingestion'
    static_configs:
      - targets: ['ingestion:9464']
