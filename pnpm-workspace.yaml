# pnpm workspace — https://pnpm.io/workspaces
packages:
  - 'apps/*'
  - 'services/*'
  - 'packages/*'

# Catalogs (centralised dependency versions) can be introduced later:
# catalog:
#   typescript: ^5.9.0

# pnpm 10+ blocks dependency build scripts by default; allow only the ones we trust.
# `false` marks a build as explicitly decided (ignored) so a fresh CI/Docker
# install does not error on it — @scarf/scarf is just no-op install analytics.
allowBuilds:
  esbuild: true
  lefthook: true
  protobufjs: true
  vue-demi: true
  '@scarf/scarf': false
